<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Chat App</h1>
        </div>
        <div class="room-controls">
            <p class="identity">You are <strong id="username-display"></strong></p>
            <div class="room-code-row">
                <span>Room: <strong id="room-code-display"></strong></span>
                <button type="button" id="copy-room-button">Copy</button>
                <button type="button" id="create-room-button">Create Room</button>
            </div>
            <div class="join-room-row">
                <input type="text" id="join-room-code" placeholder="Enter room code" maxlength="6" autocomplete="off">
                <button type="button" id="join-room-button">Join</button>
            </div>
            <p id="room-status" class="room-status" aria-live="polite"></p>
        </div>
        <div class="chat-box" id="chat-box">
        </div>
        <div class="message-input">
            <input type="text" id="message" placeholder="Type a message..." autocomplete="off">
            <button id="sendButton" type="button">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
